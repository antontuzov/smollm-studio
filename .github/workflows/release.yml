name: Release

# Builds signed-or-unsigned desktop bundles for macOS and Windows.
# Runs on a `v*` tag (publishing a GitHub Release) and on demand (artifacts only).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  bundles:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal
        shell: bash

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm through corepack
        run: corepack enable && corepack prepare --activate
        shell: bash

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install frontend dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      # Linux is not a supported target; the runner here is macOS or Windows and
      # needs no extra system packages.
      - name: Build and bundle
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: desktop
          args: ""
          # Leave empty: unsigned local builds. Fill in the Apple and Windows
          # signing secrets before publishing binaries you intend to be trusted.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: smollm-studio-${{ matrix.platform }}
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/macos/*.app
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # The CLI is pure Rust, so one job covers every platform with `--target`.
  cli:
    name: CLI binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Build smollm
        run: cargo build --release -p smollm-cli --bin smollm

      - name: Upload CLI
        uses: actions/upload-artifact@v4
        with:
          name: smollm-cli-linux-x86_64
          path: target/release/smollm

  release:
    name: GitHub Release
    needs: [bundles, cli]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "smollm-studio-*"
          merge-multiple: true

      - name: Notes
        id: notes
        run: |
          {
            echo "body<<EOF"
            echo "See [CHANGELOG.md](./CHANGELOG.md) for what is in ${{ github.ref_name }}."
            echo ""
            echo "Bundles here are **unsigned local builds**. Downloads from an unsigned"
            echo "publisher need a right-click > Open on macOS the first time."
            echo ""
            echo "Before you install: real inference is still an adapter seam in this"
            echo "version, so chat replies are simulated. Read the README section"
            echo "\"what is real, and what is a seam\"."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            **/*.dmg
            **/*.app
            **/*.msi
            **/*.exe
            **/smollm
          body: ${{ steps.notes.outputs.body }}
          fail_on_unmatched_files: true
