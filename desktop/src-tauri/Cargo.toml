[package]
name = "smollm-studio-desktop"
description = "SmolLLM Studio desktop shell (Tauri v2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "smollm_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[features]
# Native inference in the desktop shell. Off by default: it compiles llama.cpp,
# so a plain `tauri build` keeps working on a machine with no native toolchain.
llama-cpp = ["smollm-engine/llama-cpp"]

[dependencies]
tauri.workspace = true
tauri-plugin-dialog.workspace = true
smollm-core.workspace = true
smollm-engine = { workspace = true, features = ["mock"] }
smollm-models.workspace = true
smollm-hardware.workspace = true
smollm-server.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
futures.workspace = true
uuid.workspace = true
