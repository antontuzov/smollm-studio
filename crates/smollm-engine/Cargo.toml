[package]
name = "smollm-engine"
description = "Engine abstraction layer: MockEngine, GGUF metadata engine and feature-flagged native adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["mock"]
mock = []
# Real llama.cpp inference: this flag pulls in the bindings, which vendor and
# build the C++ library, so it needs cmake plus a C/C++ toolchain and cannot be
# a default. Without it the crate stays pure Rust, which is what CI and every
# shipped build use. On Apple machines llama.cpp's own build adds the Metal
# backend when the toolchain can compile it; the engine asks the library at
# runtime whether offload is available, so the answer is never guessed.
llama-cpp = ["dep:llama-cpp-2"]
# Pure-Rust Candle backend, experimental.
candle = []

[dependencies]
smollm-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
futures.workspace = true
uuid.workspace = true
llama-cpp-2 = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
